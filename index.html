        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:active { background: #174ea6; }
        #log { margin-top: 20px; background: #202124; color: #00ff00; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 12px; height: 120px; overflow-y: auto; }

</head>

    <button onclick="publishMessage()">發送訊息給手機</button>

</div>
